name: 构建未签名 IPA

# 手动触发为主；打 v* tag 也会自动构建并发 Release。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner 镜像（monkeyparser 是 x86_64，arm64 镜像需 Rosetta）"
        required: false
        default: "macos-15"
        type: choice
        options:
          - macos-15
          - macos-14
          - macos-13
      base_app_url:
        description: "已脱壳 bili-universal.app 压缩包直链（留空则用下面的 release/asset 组合）"
        required: false
        default: ""
      base_app_repo:
        description: "提供脱壳包的仓库"
        required: false
        default: "TouchFriend/BiliBiliMApp"
      base_app_tag:
        description: "脱壳包所在 release tag"
        required: false
        default: "3.1.0"
      base_app_asset:
        description: "脱壳包资源名"
        required: false
        default: "bili-universal_8.89.0.app.zip"
      make_release:
        description: "构建成功后是否创建 GitHub Release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译并打包
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 90

    env:
      THEOS: /opt/theos
      MONKEYDEV: /opt/MonkeyDev
      BASE_APP_REPO: ${{ inputs.base_app_repo || 'TouchFriend/BiliBiliMApp' }}
      BASE_APP_TAG: ${{ inputs.base_app_tag || '3.1.0' }}
      BASE_APP_ASSET: ${{ inputs.base_app_asset || 'bili-universal_8.89.0.app.zip' }}
      BASE_APP_URL: ${{ inputs.base_app_url }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 打印构建环境
        run: |
          echo "runner 架构 : $(uname -m)"
          echo "macOS 版本  : $(sw_vers -productVersion)"
          echo "Xcode 路径  : $(xcode-select -p)"
          xcodebuild -version
          echo "可用 SDK:"
          xcodebuild -showsdks | grep -i ios || true

      # monkeyparser / class-dump 是 2022 年编译的 x86_64 二进制。
      # Apple Silicon runner 上必须有 Rosetta 2 才能执行。
      - name: 确保 Rosetta 2 可用（x86_64 工具链）
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            echo "arm64 runner，检查 Rosetta 2 ..."
            if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "Rosetta 2 已就绪"
            else
              echo "安装 Rosetta 2 ..."
              sudo softwareupdate --install-rosetta --agree-to-license || true
            fi
          else
            echo "x86_64 runner，无需 Rosetta"
          fi

      - name: 安装 theos（提供 logos 头文件与 libroot.a）
        run: |
          sudo mkdir -p "$THEOS"
          sudo chown -R "$(whoami)" "$THEOS"
          git clone --depth 1 --recursive --shallow-submodules \
            https://github.com/theos/theos.git "$THEOS"
          echo "--- 关键文件校验 ---"
          test -f "$THEOS/vendor/lib/libroot.a" \
            && echo "OK  libroot.a ($(stat -f%z "$THEOS/vendor/lib/libroot.a") 字节)" \
            || { echo "FAIL 缺少 libroot.a，链接阶段必定失败"; exit 1; }
          test -d "$THEOS/vendor/include" \
            && echo "OK  vendor/include" \
            || { echo "FAIL 缺少 vendor/include"; exit 1; }

      # 直接取文件即可，不跑 md-install：那个脚本会去改 Xcode 模板目录，
      # 在 CI 上既没必要又容易失败。工程需要的只是 /opt/MonkeyDev 下的文件。
      - name: 安装 MonkeyDev（仅取文件，不做 Xcode 模板集成）
        run: |
          sudo mkdir -p "$MONKEYDEV"
          sudo chown -R "$(whoami)" "$MONKEYDEV"
          git clone --depth 1 https://github.com/AloneMonkey/MonkeyDev.git "$MONKEYDEV"
          chmod +x "$MONKEYDEV"/bin/* "$MONKEYDEV"/Tools/* || true
          echo "--- 关键文件校验 ---"
          for f in bin/monkeyparser Tools/pack.sh Frameworks/libsubstrate.dylib; do
            test -e "$MONKEYDEV/$f" && echo "OK  $f" || { echo "FAIL 缺少 $f"; exit 1; }
          done

      - name: 验证 monkeyparser 可执行
        run: |
          echo "架构信息:"
          file "$MONKEYDEV/bin/monkeyparser"
          set +e
          OUT=$("$MONKEYDEV/bin/monkeyparser" 2>&1)
          CODE=$?
          set -e
          echo "退出码 = $CODE"
          echo "$OUT" | head -20
          # 无参数运行会打印用法（非 0 退出很正常）。只要不是「无法执行」就算通过。
          if echo "$OUT" | grep -qi "bad CPU type\|cannot execute\|Exec format"; then
            echo "::error::monkeyparser 无法在本 runner 执行（x86_64 二进制 / Rosetta 缺失）。请改用 macos-13 重跑。"
            exit 1
          fi
          echo "monkeyparser 可执行"

      - name: 下载已脱壳的 bili-universal.app
        run: |
          set -euo pipefail
          if [ -n "${BASE_APP_URL}" ]; then
            URL="${BASE_APP_URL}"
          else
            URL="https://github.com/${BASE_APP_REPO}/releases/download/${BASE_APP_TAG}/${BASE_APP_ASSET}"
          fi
          echo "下载: $URL"
          curl -fL --retry 3 --retry-delay 5 -o base-app.zip "$URL"
          echo "大小: $(du -h base-app.zip | cut -f1)"

          mkdir -p BiliBiliMD/TargetApp
          unzip -qq base-app.zip -d BiliBiliMD/TargetApp
          rm -f base-app.zip
          rm -rf BiliBiliMD/TargetApp/__MACOSX

          # 压缩包里可能多套一层目录，统一提到 TargetApp 下一级
          APP=$(find BiliBiliMD/TargetApp -maxdepth 4 -type d -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::压缩包里没找到 .app"
            find BiliBiliMD/TargetApp -maxdepth 3 | head -40
            exit 1
          fi
          if [ "$(dirname "$APP")" != "BiliBiliMD/TargetApp" ]; then
            echo "上移 $APP"
            mv "$APP" BiliBiliMD/TargetApp/
            find BiliBiliMD/TargetApp -maxdepth 1 -type d ! -name TargetApp -empty -delete || true
          fi
          APP=$(find BiliBiliMD/TargetApp -maxdepth 2 -type d -name "*.app" | head -n 1)
          echo "目标 App: $APP"

          # 确认是脱壳包：cryptid 必须为 0，否则注入的 dylib 不会被加载
          BIN=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP/Info.plist")
          echo "主二进制: $BIN"
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          echo "版本: $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")"
          if otool -l "$APP/$BIN" 2>/dev/null | grep -A4 LC_ENCRYPTION_INFO | grep -q "cryptid 1"; then
            echo "::error::该 App 仍处于加密状态（cryptid=1），必须使用已脱壳的包"
            exit 1
          fi
          echo "脱壳校验通过 (cryptid=0)"

      # [修复 v3.1.7] 之前跳过了 md --xcbp-logos（Logos 预处理），直接编译仓库提交的 .mm。
      # 但仓库提交的 .mm 可能是旧 Logos 生成的陈旧产物，导致功能 hook 注册失效
      # （隔离测试证实：上游 base + 我们 dylib 设置失效，上游自己构建的 dylib 正常）。
      # 上游本地构建会用 Logos 从 .xm 重新生成 .mm，这里恢复该阶段，与上游构建方式对齐。
      # 仅保留跳过 pack.sh codesign（我们打包时统一 ad-hoc 签名）。
      - name: CI 适配 pbxproj（恢复 Logos 预处理，仅跳过签名阶段）
        run: |
          python3 - <<'PY'
          import re, sys
          p = "BiliBiliMD.xcodeproj/project.pbxproj"
          s = open(p, encoding="utf-8").read()
          repl = {
              'shellScript = "/opt/MonkeyDev/Tools/pack.sh codesign\\n";':
                  'shellScript = "echo \\"[CI] 跳过 codesign，产出未签名 IPA\\"\\n";',
          }
          for old, new in repl.items():
              if old not in s:
                  print("::error::pbxproj 里没找到待替换片段: %s" % old); sys.exit(1)
              s = s.replace(old, new)
              print("已替换:", old.strip())
          # Logos 预处理阶段（md --xcbp-logos）保持原样，构建时会重新生成 .mm
          assert 'md --xcbp-logos' in s, "md --xcbp-logos 阶段丢失"
          print("已确认 md --xcbp-logos 阶段保留（构建时重新生成 .mm）")
          # pack.sh 本体必须保留（负责合并目标 App + 注入 dylib）
          assert 'shellScript = "/opt/MonkeyDev/Tools/pack.sh\\n";' in s, "pack.sh 主阶段丢失"
          print("已确认 pack.sh 主阶段保留")
          open(p, "w", encoding="utf-8").write(s)
          PY

      # [v3.1.8] 之前依赖 pbxproj 的 md --xcbp-logos 跑 Logos 重新生成 .mm，
      # 但实测 v3.1.7 dylib 与 v3.1.6 字节级完全一致（sha256 相同）——md 没真正跑成，CI 继续用了仓库提交的旧 .mm，
      # 旧 .mm 是旧 Logos 生成，目标类名跟 B 站 8.89.0 对不上 → 主界面 hook（NJTabAd/NJMallAd/NJAccount）注册失败。
      # 这里绕开 md，直接调用 theos 的 logos.pl 重新生成所有 .mm（兜底）。
      - name: 显式用 logos.pl 重新生成所有 .mm
        run: |
          set -euo pipefail
          THEOS=/opt/theos
          LOGOS=$(find "$THEOS" -name "logos.pl" -type f 2>/dev/null | head -n1)
          if [ -z "$LOGOS" ]; then
            echo "::error::在 $THEOS 下找不到 logos.pl"
            exit 1
          fi
          echo "使用 logos.pl: $LOGOS"
          chmod +x "$LOGOS" 2>/dev/null || true
          # 对 BiliBiliMDDylib 下所有 .xm 重新生成 .mm（备份原文件，失败可回退）
          REGEN_OK=0
          REGEN_FAIL=0
          find BiliBiliMDDylib -name "*.xm" -type f | while read -r xm; do
            mm="${xm%.xm}.mm"
            if [ -f "$mm" ]; then cp "$mm" "${mm}.bak"; fi
            if "$LOGOS" "$xm" > "$mm" 2>/dev/null; then
              echo "  ✓ ${mm}"
              REGEN_OK=$((REGEN_OK+1))
            else
              echo "  ✗ 失败 $xm"
              [ -f "${mm}.bak" ] && mv "${mm}.bak" "$mm" || true
              REGEN_FAIL=$((REGEN_FAIL+1))
            fi
          done
          # 验证 NJLiveDetailAd.mm 已无 LynxView 引用（人数修复）
          if grep -a -q "LynxView" BiliBiliMDDylib/Logos/Home/Live/NJLiveDetailAd.mm; then
            echo "::error::NJLiveDetailAd.mm 仍有 LynxView 引用,人数修复未生效"
            exit 1
          fi
          echo "✓ 验证:NJLiveDetailAd.mm 已无 LynxView 引用"
          echo "  重新生成成功: $REGEN_OK, 失败: $REGEN_FAIL"

      - name: xcodebuild 编译（Release / arm64 / 不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project BiliBiliMD.xcodeproj \
            -scheme BiliBiliMD \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tail -n 400

      # [v3.1.10 修复] 移除对 BBLiveBasePopularRankEntryView / BBLiveBasePopularHotRankEntryView
      # 的强制检查。之前 CI 要求这两个 hook 必须存在，但这些 hook 拦截了人气数据，
      # 导致直播间右上角人数不显示。删除这些 hook 后人数恢复正常显示，但 CI 检查失败。
      # 现在只保留对 LynxView 的检查（确保一刀切 hook 已移除）。
      - name: 校验产物并断言 LynxView 已摘除
        id: verify
        run: |
          set -euo pipefail
          PRODUCTS="build/Build/Products/Release-iphoneos"
          ls -la "$PRODUCTS"

          DYLIB="$PRODUCTS/libBiliBiliMDDylib.dylib"
          test -f "$DYLIB" || { echo "::error::没有生成 libBiliBiliMDDylib.dylib"; exit 1; }
          echo "dylib 架构: $(lipo -info "$DYLIB")"

          # 本次修复的核心断言：整个工程只有 NJLiveDetailAd 引用过 LynxView，
          # 且引用方式是 objc_getClass("LynxView")，字符串会落进 __cstring。
          # 所以编译产物里只要还能搜到 LynxView，就说明 hook 没摘干净。
          if grep -a -q "LynxView" "$DYLIB"; then
            echo "::error::dylib 里仍存在 LynxView 字符串，一刀切 hook 未摘除干净"
            exit 1
          fi
          echo "✓ 断言通过：dylib 内已无 LynxView 引用，右上角人气值不再被拦截"

          # [v3.1.10] 不再强制检查 BBLiveBasePopularRankEntryView / BBLiveBasePopularHotRankEntryView
          # 这两个 hook 会拦截人气数据导致人数不显示，已在代码中删除以恢复人数显示。

          APP="$PRODUCTS/BiliBiliMD.app"
          test -d "$APP" || { echo "::error::没有生成 BiliBiliMD.app"; exit 1; }
          BIN=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP/Info.plist")
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist")
          echo "主二进制=$BIN  BundleID=$BID  版本=$VER"

          # 确认 dylib 真的被注入进主二进制的加载命令
          if otool -L "$APP/$BIN" | grep -q "libBiliBiliMDDylib.dylib"; then
            echo "断言通过：dylib 已注入主二进制"
            otool -L "$APP/$BIN" | grep -i "BiliBiliMDDylib\|substrate" || true
          else
            echo "::error::dylib 未注入主二进制，装上也不会生效"
            otool -L "$APP/$BIN" | head -20
            exit 1
          fi

          echo "bili_version=$VER" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BID" >> "$GITHUB_OUTPUT"

      # TrollStore / 全能签（CoreTrust 绕过、不跑 substrated 守护进程）下，
      # MonkeyDev 注入的旧版 Cydia Substrate（libsubstrate.dylib，FAT armv7+arm64）
      # 在首次加载 hook 时崩溃，表现为「签名/巨魔安装成功但打开闪退」。
      # 上游可用包改用现代 ElleKit（libellekit.dylib）。这里把注入的 hooking 库换成
      # 仓库内 vendored 的 libellekit.dylib，并改掉 tweak dylib 的弱加载命令名。
      - name: 注入 ElleKit 替代 Cydia Substrate（修复 TrollStore / 全能签 闪退）
        run: |
          set -euo pipefail
          APP_SRC="build/Build/Products/Release-iphoneos/BiliBiliMD.app"
          FRAME="$APP_SRC/Frameworks"
          test -d "$FRAME" || { echo "::error::没有 Frameworks 目录"; exit 1; }
          test -f "Vendor/libellekit.dylib" || { echo "::error::缺少 Vendor/libellekit.dylib"; exit 1; }

          # 1) 放入已知可用的 libellekit.dylib（取自上游可用 IPA，随仓库 vendored）
          cp -f "Vendor/libellekit.dylib" "$FRAME/libellekit.dylib"
          chmod 755 "$FRAME/libellekit.dylib"
          echo "已放入 libellekit.dylib: $(lipo -info "$FRAME/libellekit.dylib")"

          # 2) 把任何对 Cydia Substrate 的弱加载命令改指 libellekit。
          #    tweak dylib 记录的为 cmd=0x80000018 -> @executable_path/Frameworks/libsubstrate.dylib
          changed=0
          for d in "$FRAME"/*.dylib; do
            [ -f "$d" ] || continue
            if otool -L "$d" 2>/dev/null | grep -q "libsubstrate.dylib"; then
              install_name_tool -change \
                "@executable_path/Frameworks/libsubstrate.dylib" \
                "@executable_path/Frameworks/libellekit.dylib" \
                "$d"
              echo "已重指: $d"
              changed=$((changed+1))
            fi
          done
          echo "重指 dylib 数: $changed"

          # 3) 删除旧 Cydia Substrate（FAT armv7+arm64，TrollStore 下会崩）
          rm -f "$FRAME/libsubstrate.dylib"

          # 4) 校验：tweak dylib 现在必须加载 libellekit，且不再引用 libsubstrate
          if otool -L "$FRAME/libBiliBiliMDDylib.dylib" | grep -q "libellekit.dylib"; then
            echo "断言通过：tweak dylib 已改加载 libellekit.dylib"
          else
            echo "::error::tweak dylib 未成功改指 libellekit.dylib"
            exit 1
          fi
          if otool -L "$FRAME/libBiliBiliMDDylib.dylib" | grep -q "libsubstrate.dylib"; then
            echo "::error::仍存在 libsubstrate 引用"
            exit 1
          fi
          echo "清理完成：Frameworks 内已无 libsubstrate.dylib"

      # 启动闪退的真正根因（v3.1.1 之前一直崩的原因）：
      # 我们用 CODE_SIGNING_ALLOWED=NO 编译并禁用了 pack.sh codesign，导致
      # 主二进制 bili-universal 和注入的 tweak dylib 都没有 LC_CODE_SIGNATURE。
      # TrollStore/全能签 的 CoreTrust 绕过只豁免「安装」校验，不豁免「运行时」
      # dyld 对注入 dylib 的签名检查 —— dyld 加载未签名 dylib 直接 abort，打开即闪退。
      # 上游可用包是全签名包（主二进制+所有 dylib 都有签名），所以任何工具都能跑。
      # 这里对整包做 ad-hoc 签名，补齐所有 LC_CODE_SIGNATURE，与上游发行格式一致。
      - name: Ad-hoc 签名整个 .app（修复 TrollStore / 全能签 启动闪退）
        run: |
          set -euo pipefail
          APP_SRC="build/Build/Products/Release-iphoneos/BiliBiliMD.app"
          FRAME="$APP_SRC/Frameworks"
          # 注意：codesign 对 bundle 的签名只会给主二进制加 LC_CODE_SIGNATURE，
          # 未签名的嵌套 Frameworks dylib 不会各自补签名（只是封进 CodeResources）。
          # dyld 运行时要求注入 dylib 自带签名，所以必须先逐个签 dylib，再签整包封存。
          for d in "$FRAME"/*.dylib; do
            [ -f "$d" ] || continue
            codesign -f -s - --timestamp=none "$d"
            echo "已签: $(basename "$d")"
          done
          codesign -f -s - --timestamp=none "$APP_SRC"
          # 校验：主二进制与所有 dylib 都必须已带 ad-hoc 签名
          codesign -dv "$APP_SRC" 2>&1 | grep -qi "Signature=adhoc" \
            || { echo "::error::主二进制 ad-hoc 签名失败"; exit 1; }
          codesign -dv "$FRAME/libBiliBiliMDDylib.dylib" 2>&1 | grep -qi "Signature=adhoc" \
            || { echo "::error::tweak dylib 未签名"; exit 1; }
          codesign -dv "$FRAME/libellekit.dylib" 2>&1 | grep -qi "Signature=adhoc" \
            || { echo "::error::libellekit.dylib 未签名"; exit 1; }
          echo "整包 ad-hoc 签名完成（主二进制 + $(ls "$FRAME"/*.dylib | wc -l | tr -d ' ') 个 dylib）"

      - name: 打包 IPA
        id: pack
        run: |
          set -euo pipefail
          APP_SRC="build/Build/Products/Release-iphoneos/BiliBiliMD.app"
          # MonkeyDev 的 pack.sh 在本项目的 TargetApp 目录结构下，会把整份 base app
          # 作为子目录 bili-universal.app 再嵌进 .app 内部，导致 IPA 体积翻倍（约 554MB）。
          # iOS 只加载顶层 .app，嵌套那份纯属重复，打包前删掉。
          NESTED=$(find "$APP_SRC" -maxdepth 1 -mindepth 1 -type d -name "*.app")
          if [ -n "$NESTED" ]; then
            echo "清理嵌套重复 base app:"
            du -sh $NESTED
            rm -rf $NESTED
          fi
          VER="${{ steps.verify.outputs.bili_version }}"
          NAME="BiliBiliMApp_${VER}_livecount-fixed_unsigned"
          rm -rf Payload && mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/BiliBiliMD.app" Payload/
          zip -qry "${NAME}.ipa" Payload
          rm -rf Payload
          echo "产物: ${NAME}.ipa  ($(du -h "${NAME}.ipa" | cut -f1))"
          echo "ipa_name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: 上传 IPA 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.ipa_name }}
          path: ${{ steps.pack.outputs.ipa_name }}.ipa
          retention-days: 30
          compression-level: 0

      - name: 编译失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/Build/Products
            BiliBiliMD.xcodeproj/project.pbxproj
          retention-days: 7
          if-no-files-found: ignore

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.make_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="build-$(date +%Y%m%d-%H%M%S)"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          cat > notes.md <<'EOF'
          ## 本次改动

          修复：进入直播间后右上角「人气值 / 在线人数」不显示。

          根因是 `BiliBiliMDDylib/Logos/Home/Live/NJLiveDetailAd` 里为了干掉
          「热门榜 / 人气榜」，对 `LynxView` 的全部 init 一律 `return nil`。
          但直播间右上角的人气值同样由 Lynx 渲染，被这一刀切一起干掉了。

          本版本删除了这个过宽的 hook。人气榜入口的移除仍由这几个具体类负责，不受影响：

          - `BBLiveBaseAreaRankEntryView` / `BBLiveBaseMixedRankEntryView` → `initWithFrame:` 返回 nil

          CI 已自动断言：产物内不再包含 `LynxView` 引用。

          ## 安装

          本版本为 **ad-hoc 签名包**（主二进制 + 注入 dylib 全部补齐 `LC_CODE_SIGNATURE`），
          解决了 TrollStore / 全能签 下「安装成功但打开闪退」的问题。

          - **TrollStore（巨魔）/ 全能签**：直接安装即可，不再闪退。
            此前版本未签名，dyld 运行时拒绝加载未签名的注入 dylib，导致打开即闪退；
            本版已与上游发行格式对齐（全签名）。
          - 说明：ElleKit 与 Substrate 都依赖越狱 / 巨魔环境，普通未越狱自签无法加载 hook。

          包名为官方包名 `tv.danmaku.bilianime`，安装前请先卸载官方哔哩哔哩。

          ## 致谢

          上游项目：https://github.com/TouchFriend/BiliBiliMApp
          EOF
          gh release create "$TAG" \
            "${{ steps.pack.outputs.ipa_name }}.ipa" \
            --title "$TAG 修复直播间右上角人数" \
            --notes-file notes.md

      - name: 构建摘要
        if: always()
        run: |
          {
            echo "## 构建结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| runner | ${{ inputs.runner || 'macos-15' }} ($(uname -m)) |"
            echo "| 基础 App | ${BASE_APP_ASSET} |"
            echo "| B 站版本 | ${{ steps.verify.outputs.bili_version }} |"
            echo "| Bundle ID | ${{ steps.verify.outputs.bundle_id }} |"
            echo "| IPA | ${{ steps.pack.outputs.ipa_name }}.ipa |"
            echo "| 签名 | 未签名，需自行重签 |"
          } >> "$GITHUB_STEP_SUMMARY"
